</head><body><main class="wrap"><div class="brand">ZENTRA / KIT SUA PRIMEIRA MENTORIA</div><section class="confirmation"><h1>Pagamento confirmado.</h1><p>Seu acesso ao Kit Sua Primeira Mentoria foi enviado para o seu e-mail, junto com o seu código pessoal de acesso. Confira também a caixa de spam/promoções. Se não chegar em 10 minutos, escreva para contato@ogrupozentra.com.</p></section><div id="upsell-slot"></div></main>
<script>
const UPSELL_ATIVO = true;
const UPSELL_TITULO = 'O Kit entrega as ferramentas. O EU MENTOR ensina as decisões por trás delas.';
const UPSELL_TEXTO = 'Para quem acabou de comprar o Kit, o EU MENTOR sai pela metade do preço.\n\nO Kit ajuda a montar a primeira versão da sua oferta. O EU MENTOR é a formação com João e Pedro que mostra como chegar a cada decisão: qual experiência vira mentoria, para quem, com qual método, a que preço, como apresentar e como conduzir a primeira turma.\n\nVocê entra na primeira turma: os encontros são ao vivo e ficam gravados. Depois da compra, nossa equipe envia pelo WhatsApp o calendário e o link do grupo.\n\nNão inclui acompanhamento individual nem garante clientes ou faturamento. Direito de arrependimento de 7 dias.';
const UPSELL_URL = 'https://vero.ogrupozentra.com/checkout/link/64cfa111-5fa8-4419-a515-844ed56ff5cb?utm_source=kit_obrigado&utm_medium=upsell';
const UPSELL_PRECO = 'R$ 248,50 à vista ou 12x de R$ 20,71 sem juros';
if(UPSELL_ATIVO){
 const card=document.createElement('section');card.className='upsell';
 const title=document.createElement('h2');title.textContent=UPSELL_TITULO;
 const text=document.createElement('p');text.textContent=UPSELL_TEXTO;text.style.whiteSpace='pre-line';
 const price=document.createElement('p');price.className='uprice';price.textContent=UPSELL_PRECO;
 const button=document.createElement('a');button.className='go';button.href=UPSELL_URL;button.textContent='Quero o EU MENTOR por R$ 248,50';
 const note=document.createElement('p');note.className='unote';note.textContent='Condição para quem comprou o Kit.';
 const no=document.createElement('a');no.className='uno';no.href='#';no.textContent='Não, vou seguir só com o Kit';
 no.addEventListener('click',e=>{e.preventDefault();card.remove();});
 card.append(title,text,price,button,note,no);document.getElementById('upsell-slot').append(card);
}
</script></body></html>
